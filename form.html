<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Form pendaftaran akun pengguna."
    />

    <title>Form Pendaftaran Akun</title>

    <style>
      .form-table {
        border-collapse: collapse;
      }

      .form-table td {
        padding: 5px;
      }

      .form-table input,
      .form-table select {
        max-width: 100%;
      }
    </style>
  </head>

  <body>
    <nav>
      <p>
        <a href="index.html">IMDb Movies</a> |
        <a href="blog.html">Dev Blogs</a> |
        <a href="form.html">Form Pendaftaran</a> |
        <a href="cv.html">Curriculum Vitae</a>
      </p>
    </nav>

    <hr />

    <main>
      <h1>Form Pendaftaran Akun</h1>

      <form action="#" method="POST">
        <fieldset>
          <legend>Daftar Akun</legend>

          <table class="form-table">
            <tbody>
              <tr>
                <td>
                  <label for="nama">Nama</label>
                </td>

                <td>:</td>

                <td>
                  <input
                    type="text"
                    id="nama"
                    name="nama"
                    autocomplete="name"
                  />
                </td>
              </tr>

              <tr>
                <td>Jenis Kelamin</td>

                <td>:</td>

                <td>
                  <input
                    type="radio"
                    id="laki-laki"
                    name="gender"
                    value="Laki-Laki"
                  />

                  <label for="laki-laki">Laki-Laki</label>

                  <input
                    type="radio"
                    id="perempuan"
                    name="gender"
                    value="Perempuan"
                  />

                  <label for="perempuan">Perempuan</label>
                </td>
              </tr>

              <tr>
                <td>
                  <label for="tempat_lahir">Tempat Lahir</label>
                </td>

                <td>:</td>

                <td>
                  <input
                    type="text"
                    id="tempat_lahir"
                    name="tempat_lahir"
                  />
                </td>
              </tr>

              <tr>
                <td>
                  <label for="tanggal_lahir">Tanggal Lahir</label>
                </td>

                <td>:</td>

                <td>
                  <input
                    type="date"
                    id="tanggal_lahir"
                    name="tanggal_lahir"
                    autocomplete="bday"
                  />
                </td>
              </tr>

              <tr>
                <td>
                  <label for="agama">Agama</label>
                </td>

                <td>:</td>

                <td>
                  <select id="agama" name="agama">
                    <option value="">-- Pilih Agama --</option>
                    <option value="Kristen">Kristen</option>
                    <option value="Katolik">Katolik</option>
                    <option value="Islam">Islam</option>
                    <option value="Hindu">Hindu</option>
                    <option value="Buddha">Buddha</option>
                    <option value="Konghucu">Konghucu</option>
                  </select>
                </td>
              </tr>

              <tr>
                <td>Hobi</td>

                <td>:</td>

                <td>
                  <input
                    type="checkbox"
                    id="olahraga"
                    name="hobi"
                    value="Olahraga"
                  />

                  <label for="olahraga">Olahraga</label>

                  <input
                    type="checkbox"
                    id="membaca"
                    name="hobi"
                    value="Membaca"
                  />

                  <label for="membaca">Membaca</label>

                  <input
                    type="checkbox"
                    id="ngoding"
                    name="hobi"
                    value="Ngoding"
                  />

                  <label for="ngoding">Ngoding</label>
                </td>
              </tr>

              <tr>
                <td>
                  <label for="password">Password</label>
                </td>

                <td>:</td>

                <td>
                  <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="new-password"
                  />
                </td>
              </tr>

              <tr>
                <td>Persetujuan</td>

                <td>:</td>

                <td>
                  <input
                    type="checkbox"
                    id="persetujuan"
                    name="persetujuan"
                  />

                  <label for="persetujuan">
                    Saya menyetujui syarat dan ketentuan
                  </label>
                </td>
              </tr>

              <tr>
                <td></td>
                <td></td>

                <td>
                  <button type="submit">Daftar</button>
                </td>
              </tr>
            </tbody>
          </table>
        </fieldset>
      </form>
    </main>
  </body>
</html>
